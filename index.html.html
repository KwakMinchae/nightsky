<title>Starlit Meadow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed WebGPU canvas; small glassy HUD pinned to corners. Single dark look by design. */
:root{
  --ink:#dfe6f5; --dim:#8d9ab3; --glass:rgba(10,14,26,.55); --line:rgba(170,190,230,.18); --glow:#d6f07a;
  --ui:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#03050b;color:var(--ink);font-family:var(--ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
#stats{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));font:11px/1.4 var(--mono);color:var(--dim);letter-spacing:.02em;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:13px;color:var(--ink);white-space:nowrap;transition:opacity 1.2s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#hint kbd{font:600 11px var(--mono);padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--glow)}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:250px;max-width:calc(100% - 24px);padding:14px 16px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);display:grid;gap:10px;font-size:12px}
#panel h2{margin:0 0 2px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#panel label{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px}
#panel output{font:11px var(--mono);color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
#panel input[type=range]{width:100%;accent-color:var(--glow)}
#panel select{background:#0b1020;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit}
#snd{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--ink);font-size:15px;cursor:pointer;display:grid;place-items:center}
#snd:focus-visible,#panel :focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#err{position:fixed;inset:0;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center;font-size:15px;line-height:1.6;color:var(--ink)}
#err p{max-width:46ch;margin:0}
#err b{color:var(--glow)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">

<canvas id="c" tabindex="0" aria-label="Moonlit grass meadow under a starry sky"></canvas>
<div id="stats"></div>
<div id="hint">Drag or click to look · <kbd>WASD</kbd> move · <kbd>Shift</kbd> fast · <kbd>Space</kbd>/<kbd>C</kbd> up/down · <kbd>H</kbd> settings</div>
<button id="snd" title="Night sounds (M)" aria-label="Toggle night sounds">♪</button>
<div id="panel" hidden>
  <h2>Meadow</h2>
  <label>Quality <select id="q"><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option><option value="3">Ultra</option></select><span></span></label>
  <label>Wind <input id="wind" type="range" min="0" max="2" step="0.01" value="0.8"><output id="windO"></output></label>
  <label>Exposure <input id="exp" type="range" min="0.3" max="3" step="0.01" value="1"><output id="expO"></output></label>
  <label>Moon height <input id="moon" type="range" min="4" max="60" step="1" value="21"><output id="moonO"></output></label>
  <label>Mist <input id="mist" type="range" min="0" max="3" step="0.01" value="1"><output id="mistO"></output></label>
  <label>Fireflies <input id="ffn" type="range" min="0" max="128" step="1" value="80"><output id="ffnO"></output></label>
  <label>Stars <input id="stars" type="range" min="0" max="2.5" step="0.01" value="1"><output id="starsO"></output></label>
</div>
<div id="err" hidden><p></p></div>

<script>
"use strict";
// ============================================================ WGSL
const COMMON = /* wgsl */`
struct U {
  viewProj: mat4x4f, invViewProj: mat4x4f,
  camPos: vec4f,   // xyz, time
  moonDir: vec4f,  // xyz, moon intensity
  wind: vec4f,     // dir.xy, strength, 0
  res: vec4f,      // w, h, 1/w, 1/h
  params: vec4f,   // exposure, mist, grassMax, pixelAngle
  params2: vec4f,  // fireflyCount, lightCount, starBright, 0
  planes: array<vec4f, 4>,
  camFwd: vec4f,
};
@group(0) @binding(0) var<uniform> u: U;

fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hash2(p: vec2i) -> u32 { return pcg((bitcast<u32>(p.x) * 1597334677u) ^ pcg(bitcast<u32>(p.y) + 0x9e3779b9u)); }
fn hash3(p: vec3i, s: u32) -> u32 {
  return pcg((pcg((bitcast<u32>(p.x) * 1597334677u) ^ s) ^ (bitcast<u32>(p.y) * 3812015801u)) ^ (bitcast<u32>(p.z) * 2798796415u));
}
fn u2f(h: u32) -> f32 { return f32(h >> 8u) * (1.0 / 16777216.0); }
fn grad2(c: vec2i) -> vec2f { let a = u2f(hash2(c)) * 6.2831853; return vec2f(cos(a), sin(a)); }
fn gnoise(p: vec2f) -> f32 {
  let i = vec2i(floor(p)); let f = fract(p);
  let w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(grad2(i), f);
  let b = dot(grad2(i + vec2i(1, 0)), f - vec2f(1.0, 0.0));
  let c = dot(grad2(i + vec2i(0, 1)), f - vec2f(0.0, 1.0));
  let d = dot(grad2(i + vec2i(1, 1)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y) * 1.414;
}
fn terrainH(p: vec2f) -> f32 {
  var h = 26.0 * gnoise(p / 900.0 + vec2f(3.1, 7.7));
  h += 11.0 * gnoise(p / 310.0 + vec2f(-5.2, 1.3));
  h += 4.0 * gnoise(p / 115.0);
  h += 1.0 * gnoise(p / 37.0 + vec2f(9.1, -2.3));
  h += 0.22 * gnoise(p / 9.0);
  return h;
}
fn windGust(p: vec2f) -> f32 {
  let q = p - u.wind.xy * u.camPos.w * 4.2;
  let g = gnoise(q * 0.05) * 0.7 + gnoise(q * 0.13 + vec2f(5.3, 1.1)) * 0.3;
  return smoothstep(-0.35, 0.8, g);
}
fn skyBase(d: vec3f) -> vec3f {
  let m = u.moonDir.xyz;
  let y = clamp(d.y, 0.0, 1.0);
  let zen = vec3f(0.0016, 0.0034, 0.011);
  let hor = vec3f(0.011, 0.017, 0.031);
  var c = mix(hor, zen, pow(y, 0.5));
  let cm = max(dot(d, m), 0.0);
  c += vec3f(0.020, 0.028, 0.045) * pow(cm, 5.0) * (1.0 - 0.6 * y) * u.moonDir.w;
  // faint warm glow of a far-away town on the horizon
  let az = normalize(vec2f(d.x, d.z) + vec2f(1e-5));
  c += vec3f(0.030, 0.017, 0.008) * exp(-y * 16.0) * pow(max(dot(az, normalize(vec2f(-0.9, 0.4))), 0.0), 4.0);
  if (d.y < 0.0) { c = hor * (1.0 + d.y * 1.5); }
  return max(c, vec3f(0.0));
}
fn fogColor(dir: vec3f) -> vec3f {
  let d = normalize(vec3f(dir.x, max(dir.y, 0.0) * 0.4 + 0.015, dir.z));
  var c = skyBase(d) * 1.05;
  c += vec3f(0.05, 0.06, 0.08) * pow(max(dot(dir, u.moonDir.xyz), 0.0), 8.0) * u.moonDir.w;
  return c;
}
fn applyFog(col: vec3f, wp: vec3f) -> vec3f {
  let cam = u.camPos.xyz; let rd = wp - cam; let dist = length(rd); let dir = rd / max(dist, 1e-4);
  let bf = 0.055;
  let a = 0.0032 * u.params.y * exp(-bf * cam.y);
  var hint = 1.0;
  if (abs(rd.y) > 0.01) { hint = (1.0 - exp(-bf * rd.y)) / (bf * rd.y); }
  let od = a * hint * dist + 0.00011 * dist;
  return mix(col, fogColor(dir), 1.0 - exp(-od));
}
`;

const COMPUTE = COMMON + /* wgsl */`
struct TierBuf { t: array<vec4f, 18>, info: vec4f };
@group(0) @binding(1) var<uniform> tb: TierBuf;
@group(0) @binding(2) var<storage, read_write> args: array<atomic<u32>, 8>;
@group(0) @binding(3) var<storage, read_write> instHi: array<vec4f>;
@group(0) @binding(4) var<storage, read_write> instLo: array<vec4f>;

@compute @workgroup_size(256)
fn csGrass(@builtin(global_invocation_id) gid: vec3u, @builtin(num_workgroups) nw: vec3u) {
  let idx = gid.x + gid.y * nw.x * 256u;
  if (idx >= u32(tb.info.x)) { return; }
  let nt = u32(tb.info.y);
  var k = 0u;
  for (var i = 1u; i < nt; i++) { if (f32(idx) >= tb.t[i * 3u + 2u].y) { k = i; } }
  let A = tb.t[k * 3u]; let B = tb.t[k * 3u + 1u]; let C = tb.t[k * 3u + 2u];
  // A: s, e0, b0, e1 | B: b1, widthScale, lod, heightScale | C: n, start
  let s = A.x; let n = u32(C.x); let li = idx - u32(C.y);
  let cam = u.camPos.xz;
  let base = vec2i(floor(cam / s)) - vec2i(i32(n / 2u));
  let cell = base + vec2i(i32(li % n), i32(li / n));
  let h0 = hash3(vec3i(cell, i32(k)), 0x51ed27u);
  let h1 = pcg(h0); let h2 = pcg(h1); let h3 = pcg(h2); let h4 = pcg(h3);
  let h5 = pcg(h4); let h6 = pcg(h5); let h7 = pcg(h6); let h8 = pcg(h7);
  let p = (vec2f(cell) + vec2f(u2f(h0), u2f(h1))) * s;
  let d = distance(p, cam);
  var win = 1.0;
  if (k > 0u) { win = clamp((d - (A.y - A.z)) / (2.0 * A.z), 0.0, 1.0); }
  let wout = 1.0 - clamp((d - (A.w - B.x)) / (2.0 * B.x), 0.0, 1.0);
  let w = win * wout;
  let rk = u2f(h2);
  if (rk >= w) { return; }
  let grow = clamp((w - rk) / 0.1, 0.0, 1.0);

  // conservative column cull, then exact
  let relxz = p - cam;
  let ylo = -60.0 - u.camPos.y; let yhi = 60.0 - u.camPos.y;
  for (var i = 0; i < 4; i++) {
    let pl = u.planes[i];
    let m = dot(pl.xz, relxz) + pl.w + max(pl.y * ylo, pl.y * yhi);
    if (m < -1.5) { return; }
  }
  let ty = terrainH(p);
  let mead = gnoise(p * 0.035 + vec2f(13.1, 7.3));
  let ht = (0.32 + 0.6 * u2f(h3)) * (0.5 + 0.65 * smoothstep(-0.5, 0.6, mead)) * grow * B.w;
  let ctr = vec3f(relxz.x, ty - u.camPos.y + ht * 0.5, relxz.y);
  for (var i = 0; i < 4; i++) {
    let pl = u.planes[i];
    if (dot(pl.xyz, ctr) + pl.w < -(ht * 0.8 + 0.1)) { return; }
  }
  let gust = windGust(p);
  let t = u.camPos.w;
  let wd = u.wind.xy; let ws = u.wind.z;
  let flutter = sin(t * (2.0 + 1.8 * u2f(h4)) + u2f(h5) * 40.0 + dot(p, wd) * 0.8);
  var lean = wd * ws * (0.1 + 0.85 * gust + 0.09 * flutter);
  lean += vec2f(-wd.y, wd.x) * ws * 0.12 * sin(t * 0.7 + p.x * 0.05);
  let na = u2f(h6) * 6.2831853;
  lean += vec2f(cos(na), sin(na)) * (0.1 + 0.28 * u2f(h7));
  let width = 0.042 * (0.7 + 0.6 * u2f(h8)) * B.y;
  let dry = clamp(smoothstep(0.15, 0.75, gnoise(p * 0.018 + vec2f(40.0, 3.0))) * 0.75 + (u2f(pcg(h8)) - 0.8) * 0.8, 0.0, 1.0);
  let i0 = vec4f(p.x, ty, p.y, ht);
  let i1 = vec4f(u2f(pcg(h0 ^ 77u)) * 6.2831853, width, lean.x, lean.y);
  let i2 = vec4f(u2f(pcg(h1 ^ 99u)), dry, gust, 0.0);
  if (B.z < 0.5) {
    let slot = atomicAdd(&args[1], 1u);
    if (slot * 3u + 2u < arrayLength(&instHi)) { instHi[slot*3u] = i0; instHi[slot*3u+1u] = i1; instHi[slot*3u+2u] = i2; }
  } else {
    let slot = atomicAdd(&args[5], 1u);
    if (slot * 3u + 2u < arrayLength(&instLo)) { instLo[slot*3u] = i0; instLo[slot*3u+1u] = i1; instLo[slot*3u+2u] = i2; }
  }
}
`;

const GRASS = COMMON + /* wgsl */`
override SEG: u32 = 6u;
@group(0) @binding(1) var<storage, read> inst: array<vec4f>;
@group(0) @binding(2) var<storage, read> ff: array<vec4f>;
struct GOut {
  @builtin(position) pos: vec4f,
  @location(0) wp: vec3f,
  @location(1) n: vec3f,
  @location(2) side: vec3f,
  @location(3) uv: vec2f,
  @location(4) col: vec3f,
};
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> GOut {
  var o: GOut;
  if (ii * 3u + 2u >= arrayLength(&inst)) { o.pos = vec4f(0.0, 0.0, -1.0, 1.0); return o; }
  let a = inst[ii * 3u]; let b = inst[ii * 3u + 1u]; let c = inst[ii * 3u + 2u];
  let lvl = min(vi / 2u, SEG);
  let t = f32(lvl) / f32(SEG);
  var sd = f32(vi & 1u) - 0.5;
  if (lvl == SEG) { sd = 0.0; }
  let root = a.xyz; let h = a.w;
  let ll = length(b.zw);
  let ang = min(ll, 1.35);
  var ld = vec3f(1.0, 0.0, 0.0);
  if (ll > 1e-4) { ld = vec3f(b.z, 0.0, b.w) / ll; }
  let up = vec3f(0.0, 1.0, 0.0);
  let P1 = root + up * h * 0.58 * cos(ang * 0.35) + ld * h * 0.12 * sin(ang);
  let P2 = root + (up * cos(ang) + ld * sin(ang)) * h;
  let om = 1.0 - t;
  let P = om * om * root + 2.0 * om * t * P1 + t * t * P2;
  let T = normalize(2.0 * om * (P1 - root) + 2.0 * t * (P2 - P1) + vec3f(0.0, 1e-4, 0.0));
  let s = vec3f(cos(b.x), 0.0, sin(b.x));
  let w = b.y * pow(max(1.0 - t, 0.0), 0.55) * (0.85 + 0.3 * smoothstep(0.0, 0.25, t));
  let wpos = P + s * w * sd;
  o.pos = u.viewProj * vec4f(wpos - u.camPos.xyz, 1.0);
  o.wp = wpos;
  o.n = normalize(cross(T, s));
  o.side = s;
  o.uv = vec2f(sd, t);
  o.col = c.xyz;
  return o;
}
@fragment fn fs(in: GOut) -> @location(0) vec4f {
  let cam = u.camPos.xyz;
  let V = normalize(cam - in.wp);
  var N = normalize(in.n);
  if (dot(N, V) < 0.0) { N = -N; }
  N = normalize(N + normalize(in.side) * in.uv.x * 1.2);
  let L = u.moonDir.xyz;
  let moon = vec3f(0.60, 0.71, 1.0) * u.moonDir.w;
  let t = in.uv.y; let seed = in.col.x; let dry = in.col.y; let gust = in.col.z;
  var base = mix(vec3f(0.018, 0.032, 0.013), vec3f(0.050, 0.085, 0.032), smoothstep(0.0, 0.7, t));
  base = mix(base, vec3f(0.115, 0.145, 0.065), smoothstep(0.55, 1.0, t) * 0.55);
  base *= (0.62 + 0.76 * seed) * (0.8 + 0.4 * gnoise(in.wp.xz * 0.15));
  base = mix(base, vec3f(0.15, 0.135, 0.075) * (0.55 + 0.45 * t), dry);
  let ao = mix(0.1, 1.0, pow(t, 1.15));
  let ndl = dot(N, L);
  let diff = max(ndl, 0.0) * 0.85 + 0.12;
  let back = pow(clamp(dot(-V, L), 0.0, 1.0), 4.0) * (0.2 + 0.8 * t);
  let trans = base * (1.3 * back * t + 0.25 * max(-ndl, 0.0));
  let H = normalize(L + V);
  let nv = clamp(dot(N, V), 0.0, 1.0);
  let fres = 0.04 + 0.96 * pow(1.0 - nv, 5.0);
  let spec = pow(clamp(dot(N, H), 0.0, 1.0), 22.0) * (0.25 + fres) * 0.7 * t * (0.35 + 1.3 * gust);
  let amb = vec3f(0.040, 0.058, 0.10) * (0.55 + 0.45 * N.y);
  let silver = vec3f(0.055, 0.065, 0.085) * gust * gust * t * t * (0.4 + 0.6 * pow(1.0 - nv, 2.0));
  var col = (base * (diff * moon + amb) + trans * moon + spec * moon + silver * u.moonDir.w) * ao;
  let dist = distance(in.wp, cam);
  let nl = i32(u.params2.y);
  if (dist < 32.0) {
    var fl = vec3f(0.0);
    for (var i = 0; i < nl; i++) {
      let f = ff[128 + i];
      let lv = f.xyz - in.wp; let r2 = dot(lv, lv);
      fl += f.w * (0.45 + 0.55 * abs(dot(N, lv * inverseSqrt(r2 + 1e-4)))) / (r2 * 5.0 + 0.03);
    }
    col += (base * 1.6 + vec3f(0.02, 0.03, 0.0)) * vec3f(0.75, 1.0, 0.3) * fl * 0.35 * (0.3 + 0.7 * ao);
  }
  return vec4f(applyFog(col, in.wp), 1.0);
}
`;

const TERRAIN = COMMON + /* wgsl */`
struct TOut { @builtin(position) pos: vec4f, @location(0) wp: vec3f };
@vertex fn vs(@location(0) g: vec2f) -> TOut {
  let R = 9000.0; let a = 7.0;
  let m = sign(g) * R * (exp(a * abs(g)) - 1.0) / (exp(a) - 1.0);
  let xz = u.camPos.xz + m;
  let dist = length(m);
  let y = terrainH(xz) - 0.03 - dist * 0.0015;
  var o: TOut;
  o.wp = vec3f(xz.x, y, xz.y);
  o.pos = u.viewProj * vec4f(o.wp - u.camPos.xyz, 1.0);
  return o;
}
@fragment fn fs(in: TOut) -> @location(0) vec4f {
  let cam = u.camPos.xyz;
  let dist = distance(in.wp, cam);
  let e = max(0.4, dist * 0.004);
  let p = in.wp.xz;
  let hx = terrainH(p + vec2f(e, 0.0)) - terrainH(p - vec2f(e, 0.0));
  let hz = terrainH(p + vec2f(0.0, e)) - terrainH(p - vec2f(0.0, e));
  let N = normalize(vec3f(-hx, 2.0 * e, -hz));
  let L = u.moonDir.xyz; let moon = vec3f(0.60, 0.71, 1.0) * u.moonDir.w;
  let V = normalize(cam - in.wp);
  let gm = u.params.z;
  let patchN = gnoise(p * 0.018 + vec2f(40.0, 3.0));
  let dry = smoothstep(0.15, 0.75, patchN) * 0.6;
  var canopy = mix(vec3f(0.045, 0.075, 0.03), vec3f(0.12, 0.11, 0.06), dry);
  canopy *= 0.85 + 0.25 * gnoise(p * 0.2);
  let gust = windGust(p);
  let under = vec3f(0.018, 0.03, 0.012);
  let cf = smoothstep(gm * 0.35, gm * 0.95, dist);
  let alb = mix(under, canopy, cf);
  // grass canopy reads as vertical blades from afar: soften the lambert term, add sheen toward the moon
  let ndl = mix(max(dot(N, L), 0.0), 0.35 + 0.4 * max(dot(N, L), 0.0), cf);
  let back = pow(clamp(dot(-V, L), 0.0, 1.0), 6.0) * cf;
  let sheen = (0.15 + 0.5 * gust) * cf * pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 3.0);
  let amb = vec3f(0.040, 0.058, 0.10) * (0.5 + 0.5 * N.y);
  var col = alb * (ndl * moon + amb) + alb * moon * back * 1.6 + moon * sheen * 0.05;
  col *= mix(0.5, 1.0, cf);
  return vec4f(applyFog(col, in.wp), 1.0);
}
`;

const SKY = COMMON + /* wgsl */`
@vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0;
  return vec4f(p, 0.0, 1.0);
}
fn vnoise3(p: vec3f) -> f32 {

      const pan = ac.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
      const vol = ac.createGain(); vol.gain.value = 0.3 + Math.random() * 0.7;
      o.connect(g).connect(vol).connect(pan).connect(cg); o.start();
      return { g, next: ac.currentTime + Math.random() * 2, period: 0.55 + Math.random() * 0.6, pulses: 2 + (Math.random() * 3 | 0) };
    });
    const timer = setInterval(() => {
      for (const c of crickets) {
        while (c.next < ac.currentTime + 0.4) {
          for (let p = 0; p < c.pulses; p++) {
            const s = c.next + p * 0.034;
            c.g.gain.setValueAtTime(0, s); c.g.gain.linearRampToValueAtTime(1, s + 0.004); c.g.gain.linearRampToValueAtTime(0, s + 0.02);
          }
          c.next += c.period * (0.9 + Math.random() * 0.2) + (Math.random() < 0.08 ? 1.5 + Math.random() * 3 : 0);
        }
      }
    }, 120);
    return { ac, wg, lp, timer };
  }
  function updateAudio(t) {
    if (!audio || frame % 6) return;
    const q = [cam.x - Math.cos(0.35) * t * 4.2, cam.z - Math.sin(0.35) * t * 4.2];
    const g = gnoise(q[0] * 0.05, q[1] * 0.05) * 0.7 + gnoise(q[0] * 0.13 + 5.3, q[1] * 0.13 + 1.1) * 0.3;
    const gust = Math.max(0, Math.min(1, (g + 0.35) / 1.15));
    const now = audio.ac.currentTime;
    audio.wg.gain.setTargetAtTime(settings.wind * (0.05 + 0.35 * gust), now, 0.4);
    audio.lp.frequency.setTargetAtTime(300 + 900 * gust * settings.wind, now, 0.4);
  }
}
main().catch(e => { console.error(e); fail("Something went wrong starting WebGPU: " + (e && e.message ? e.message : e)); });
